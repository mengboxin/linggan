    <script>
      // Apply persisted appearance before the first paint. Keep this dependency-free
      // and in sync with src/lib/theme.ts so route loading never flashes a stale theme.
      (() => {
        const lightSurfaces = ['warm', 'clean', 'mist']
        const darkSurfaces = ['black', 'graphite', 'ash']
        const accents = ['signature', 'cobalt', 'coral', 'forest']
        const fallback = {
          theme: 'light',
          lightSurface: 'clean',
          darkSurface: 'black',
          lightAccent: 'signature',
          darkAccent: 'signature',
        }
        let stored = {}
        try {
          const parsed = JSON.parse(localStorage.getItem('ps-appearance-v1') || '{}')
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) stored = parsed
        } catch {}
        let legacyTheme = null
        try { legacyTheme = localStorage.getItem('ps-theme') } catch {}
        const theme = stored.theme === 'dark' || stored.theme === 'light'
          ? stored.theme
          : legacyTheme === 'dark' || legacyTheme === 'light'
            ? legacyTheme
            : fallback.theme
        const lightSurface = lightSurfaces.includes(stored.lightSurface) ? stored.lightSurface : fallback.lightSurface
        const darkSurface = darkSurfaces.includes(stored.darkSurface) ? stored.darkSurface : fallback.darkSurface
        const lightAccent = accents.includes(stored.lightAccent) ? stored.lightAccent : fallback.lightAccent
        const darkAccent = accents.includes(stored.darkAccent) ? stored.darkAccent : fallback.darkAccent
        const root = document.documentElement
        root.classList.remove('dark', 'light')
        root.classList.add(theme)
        root.dataset.surface = theme === 'light' ? lightSurface : darkSurface
        root.dataset.accent = theme === 'light' ? lightAccent : darkAccent
        root.style.colorScheme = theme
      })()
    </script>

      html.light .text-on-surface-variant { color: var(--app-muted) !important; opacity: 1; }
      html.light .text-primary { color: var(--accent-color) !important; }
      html.light .bg-primary   { background-color: var(--accent-color) !important; }
      html.light .border-primary { border-color: var(--accent-color) !important; }
      html.light .bg-primary-container { background-color: var(--app-accent-soft) !important; }
      html.light .text-on-primary { color: var(--app-on-accent) !important; }
      html.light .text-on-primary-container { color: var(--app-accent) !important; }
      html.light .text-secondary { color: var(--accent-color) !important; }
      html.light .shadow-\[2px_2px_0px_0px_\#4dd0e1\]            { box-shadow: 2px 2px 0px 0px rgba(45,42,38,0.3) !important; }
      html.light .shadow-\[8px_8px_0px_0px_rgba\(0\,0\,0\,0\.5\)\] { box-shadow: 4px 4px 0px 0px rgba(45,42,38,0.3) !important; }
      html.light .shadow-\[2px_2px_0px_0px_\#869395\]             { box-shadow: 2px 2px 0px 0px rgba(45,42,38,0.3) !important; }
      html.light .shadow-\[2px_2px_0px_0px_rgba\(0\,0\,0\,1\)\]   { box-shadow: 2px 2px 0px 0px rgba(45,42,38,0.5) !important; }
      html.light .pixel-grid {
        background-image:
          linear-gradient(to right, var(--border-color) 1px, transparent 1px),
          linear-gradient(to bottom, var(--border-color) 1px, transparent 1px) !important;
      }

      /* ── 共用样式 ── */
      /* Canvas 背景：暗色 #0A0E1B，亮色 #EDE7D9 */
      .canvas-bg { background-color: var(--canvas-bg); }
      /* 中文使用 Noto Sans SC，英文使用 Space Grotesk，形成像素风协调感 */
      body, * {
        font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
      }
      /* 中文内容区域强制使用 Noto Sans SC */
      :lang(zh), .zh-text {
        font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif;
      }
      .pixel-grid {
        background-size: 32px 32px;
        background-image:
          linear-gradient(to right, var(--app-dot) 1px, transparent 1px),
          linear-gradient(to bottom, var(--app-dot) 1px, transparent 1px);
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        /* 确保图标不被当作文字选中 */
        user-select: none;
        font-feature-settings: 'liga';
        -webkit-font-feature-settings: 'liga';
      }
      /* 亮色主题专用工具类 */
      html.light .light-panel { background-color: var(--panel-color); border-color: var(--border-color); }
      html.light .light-bg    { background-color: var(--bg-color); }
      html.light .light-border { border-color: var(--border-color); }
      html.light .light-text  { color: var(--text-color); }
      html.light .light-accent { color: var(--accent-color); }

      /* 自定义滚动条 */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--app-border-strong); }
      html.light .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--app-border-strong); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
